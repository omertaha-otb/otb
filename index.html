<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Foto + Saat + Ders</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: black;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;

  /* Yazı ve görsel seçilemesin */
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;

  /* Masaüstü arka planı pasif olsun */
  pointer-events: none;
}

.container {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 20px;
}

/* Eski tasarımdaki logo boyutu korunuyor */
img {
  width: 150px;
  height: auto;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* SAAT - eski tasarım korunuyor */
#clock {
  font-size: 200px;
  color: white;
  text-shadow: 3px 3px 10px black;
  line-height: 1;
  font-weight: normal;
}

/* Tarih - saatin hemen altında, sade */
.date-area {
  margin-top: 10px;
}

#day {
  color: white;
  font-size: 23px;
  font-weight: bold;
  letter-spacing: 3px;
  text-shadow: 2px 2px 5px black;
}

#date {
  margin-top: 3px;
  color: #bdbdbd;
  font-size: 17px;
  letter-spacing: 2px;
  text-shadow: 2px 2px 5px black;
}

/*
   DERS BİLGİSİ:
   Alt-orta bölgede, küçük ve sade.
   Görev çubuğuna yaklaşmaması için bottom değeri yüksek tutuldu.
*/
#lessonInfo {
  position: fixed;
  left: 50%;
  bottom: 115px;
  transform: translateX(-50%);

  text-align: center;
  color: rgba(255,255,255,0.72);

  font-family: Arial, sans-serif;
  text-shadow: 2px 2px 5px black;

  min-width: 180px;
}

#status {
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}

#lesson {
  margin-top: 3px;
  font-size: 16px;
  font-weight: normal;
}

#remaining {
  margin-top: 2px;
  font-size: 13px;
  color: rgba(255,255,255,0.55);
}

/* Sağ alt mevcut footer korunuyor */
#footer {
  position: fixed;
  right: 20px;
  bottom: 60px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 2px 2px 5px black;
}
</style>
</head>

<body>

<div class="container">
  <img
    src="https://i.ibb.co/8LRt5JP8/image.jpg"
    alt="Logo"
    draggable="false"
  >

  <div>
    <div id="clock"></div>

    <div class="date-area">
      <div id="day"></div>
      <div id="date"></div>
    </div>
  </div>
</div>

<div id="lessonInfo">
  <div id="status">OKUL DIŞI</div>
  <div id="lesson"></div>
  <div id="remaining"></div>
</div>

<div id="footer">10B ÖTB</div>

<script>
/*
=========================================================
10B DERS PROGRAMI
Programın tamamı bu index.html içindedir.
Yeni program geldiğinde bu bölüm güncellenecektir.
=========================================================
*/

/*
PDF'deki program:
Pazartesi-Perşembe:
1  09:00-09:40
2  09:50-10:30
3  10:40-11:20
4  11:30-12:10
ÖĞLE ARASI 12:10-13:30
5  13:30-14:20
6  14:30-15:10
7  15:15-15:55
8  16:00-16:40

Cuma:
1  09:00-09:40
2  09:50-10:30
3  10:40-11:20
4  11:30-12:10
ÖĞLE ARASI 12:10-13:30
5  13:30-14:10
6  14:20-15:00
7  15:10-15:50
8  15:55-16:35
*/

const schedule = {

  1: [
    ["09:00","09:40","İNGİLİZCE"],
    ["09:50","10:30","İNGİLİZCE"],
    ["10:40","11:20","BEDEN EĞİTİMİ"],
    ["11:30","12:10","BEDEN EĞİTİMİ"],
    ["13:30","14:20","DİN KÜLTÜRÜ"],
    ["14:30","15:10","KİMYA"],
    ["15:15","15:55","MATEMATİK"],
    ["16:00","16:40","MATEMATİK"]
  ],

  2: [
    ["09:00","09:40","ATÖLYE"],
    ["09:50","10:30","ATÖLYE"],
    ["10:40","11:20","ATÖLYE"],
    ["11:30","12:10","ATÖLYE"],
    ["13:30","14:20","ATÖLYE"],
    ["14:30","15:10","ATÖLYE"],
    ["15:15","15:55","ATÖLYE"],
    ["16:00","16:40","SANAT EĞİTİMİ"]
  ],

  3: [
    ["09:00","09:40","ALMANCA"],
    ["09:50","10:30","ALMANCA"],
    ["10:40","11:20","TÜRK DİLİ VE EDEBİYATI"],
    ["11:30","12:10","TÜRK DİLİ VE EDEBİYATI"],
    ["13:30","14:20","SENSÖRLER"],
    ["14:30","15:10","SENSÖRLER"],
    ["15:15","15:55","FİZİK"],
    ["16:00","16:40","FİZİK"]
  ],

  4: [
    ["09:00","09:40","MODELLEME VE MONTAJ"],
    ["09:50","10:30","MODELLEME VE MONTAJ"],
    ["10:40","11:20","MATEMATİK"],
    ["11:30","12:10","ATÖLYE"],
    ["13:30","14:20","TÜRK DİLİ VE EDEBİYATI"],
    ["14:30","15:10","TÜRK DİLİ VE EDEBİYATI"],
    ["15:15","15:55","REHBERLİK VE YÖNLENDİRME"],
    ["16:00","16:40","TÜRK DİLİ VE EDEBİYATI"]
  ],

  5: [
    ["09:00","09:40","TARİH"],
    ["09:50","10:30","TARİH"],
    ["10:40","11:20","MATEMATİK"],
    ["11:30","12:10","ATÖLYE"],
    ["13:30","14:10","TÜRK DÜŞÜNCE TARİHİ"],
    ["14:20","15:00","FELSEFE"],
    ["15:10","15:50","TÜRK DİLİ VE EDEBİYATI"],
    ["15:55","16:35","TÜRK DİLİ VE EDEBİYATI"]
  ]
};

const days = [
  "PAZAR",
  "PAZARTESİ",
  "SALI",
  "ÇARŞAMBA",
  "PERŞEMBE",
  "CUMA",
  "CUMARTESİ"
];

const months = [
  "OCAK","ŞUBAT","MART","NİSAN","MAYIS","HAZİRAN",
  "TEMMUZ","AĞUSTOS","EYLÜL","EKİM","KASIM","ARALIK"
];

function toMinutes(value) {
  const parts = value.split(":");
  return Number(parts[0]) * 60 + Number(parts[1]);
}

function remainingText(seconds) {
  seconds = Math.max(0, seconds);

  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;

  return "Kalan " +
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");
}

function updateClockAndDate(now) {

  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  const s = String(now.getSeconds()).padStart(2,"0");

  document.getElementById("clock").textContent =
    h + ":" + m + ":" + s;

  document.getElementById("day").textContent =
    days[now.getDay()];

  document.getElementById("date").textContent =
    String(now.getDate()).padStart(2,"0") +
    " " +
    months[now.getMonth()] +
    " " +
    now.getFullYear();
}

function updateLesson(now) {

  const status = document.getElementById("status");
  const lesson = document.getElementById("lesson");
  const remaining = document.getElementById("remaining");

  const day = now.getDay();

  /* Hafta sonu */
  if (!schedule[day]) {
    status.textContent = "OKUL DIŞI";
    lesson.textContent = "";
    remaining.textContent = "";
    return;
  }

  const currentMinutes =
    now.getHours() * 60 + now.getMinutes();

  const currentSeconds =
    now.getSeconds();

  const lessons = schedule[day];

  /* Dersler */
  for (let i = 0; i < lessons.length; i++) {

    const start = toMinutes(lessons[i][0]);
    const end = toMinutes(lessons[i][1]);
    const name = lessons[i][2];

    if (
      currentMinutes >= start &&
      currentMinutes < end
    ) {

      const nowTotal =
        currentMinutes * 60 + currentSeconds;

      const endTotal =
        end * 60;

      status.textContent =
        (i + 1) + ". DERS";

      lesson.textContent = name;

      remaining.textContent =
        remainingText(endTotal - nowTotal);

      return;
    }

    /* Teneffüs / öğle arası */
    if (i < lessons.length - 1) {

      const nextStart =
        toMinutes(lessons[i + 1][0]);

      if (
        currentMinutes >= end &&
        currentMinutes < nextStart
      ) {

        const nowTotal =
          currentMinutes * 60 + currentSeconds;

        const nextTotal =
          nextStart * 60;

        if (i === 3) {
          status.textContent = "ÖĞLE ARASI";
        } else {
          status.textContent = "TENEFFÜS";
        }

        lesson.textContent =
          "Sonraki: " + lessons[i + 1][2];

        remaining.textContent =
          remainingText(nextTotal - nowTotal);

        return;
      }
    }
  }

  /* Derslerden önce / sonra */
  status.textContent = "OKUL DIŞI";
  lesson.textContent = "";
  remaining.textContent = "";
}

function update() {
  const now = new Date();

  updateClockAndDate(now);
  updateLesson(now);
}

update();
setInterval(update, 1000);


/* Sağ tık / seçim / sürükleme / kopyalama engeli */
document.addEventListener("contextmenu", e => e.preventDefault(), true);
document.addEventListener("selectstart", e => e.preventDefault(), true);
document.addEventListener("dragstart", e => e.preventDefault(), true);
document.addEventListener("copy", e => e.preventDefault(), true);
document.addEventListener("cut", e => e.preventDefault(), true);
</script>

</body>
</html>
